<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SADOK Кухня — Меню-розкладка та складський облік</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SADOK" />
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 font-sans">
    <div id="root">
      <div id="app-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; padding: 20px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(37,99,235,0.4); margin-bottom: 20px;">S</div>
        <div style="font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em;">SADOK Екосистема</div>
        <div style="font-size: 13px; color: #64748b; margin-bottom: 24px;">КЗДО (ясла-садок) КТ №145 КМР «Півник»</div>
        <div style="width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: sadokSpin 0.7s linear infinite; margin-bottom: 14px;"></div>
        <div style="font-size: 12px; color: #94a3b8; font-weight: 600;">Завантаження порталу…</div>
        <div id="preloader-troubleshoot" style="display: none; margin-top: 24px;">
          <p style="font-size: 12px; color: #64748b; margin-bottom: 12px;">Завантаження триває довше ніж зазвичай?</p>
          <button onclick="window.location.reload(true)" style="padding: 8px 16px; border-radius: 10px; background: #2563eb; color: white; border: none; font-weight: 600; font-size: 12px; cursor: pointer; margin-right: 8px;">Оновити сторінку</button>
          <button onclick="if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>{r.forEach(x=>x.unregister());localStorage.clear();window.location.reload(true);});}" style="padding: 8px 16px; border-radius: 10px; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; font-weight: 600; font-size: 12px; cursor: pointer;">Очистити кеш</button>
        </div>
        <style>
          @keyframes sadokSpin { to { transform: rotate(360deg); } }
        </style>
        <script>
          setTimeout(function() {
            var t = document.getElementById('preloader-troubleshoot');
            if (t) t.style.display = 'block';
          }, 6000);
        </script>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
